<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kylixe | لوحة التحكم</title>
<style>
:root{--or:#ed712e;--cop:#e88c69;--yel:#dca14c;--cream:#f3e3c3;--card:#fbf3e2;--green:#3d3f20;--khaki:#a8a377;--line:rgba(61,63,32,.16);--ink:#3d3f20;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:96px}
a{color:var(--or)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--green);color:var(--cream);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
header.top b{font-size:18px;letter-spacing:.14em;color:var(--cream)}
header.top button{background:none;border:1px solid rgba(243,227,195,.4);color:var(--cream);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:14px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:1px solid var(--line);border-radius:22px;padding:7px 16px;cursor:pointer;font-size:15px;white-space:nowrap}
nav.tabs button[aria-selected=true]{background:var(--or);border-color:var(--or);color:#fff}
h1{font-size:22px;margin:18px 0 4px}
h2{font-size:17px;margin:26px 0 10px}
.sub{margin:0 0 16px;color:rgba(61,63,32,.75);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.thumb{width:62px;height:62px;border-radius:10px;background:#ecd9b3 center/cover no-repeat;flex:none;border:1px solid var(--line)}
.thumb.c{background-size:contain}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:rgba(61,63,32,.7)}
.btn{background:var(--or);color:#fff;border:0;border-radius:24px;padding:10px 20px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.bad{background:none;color:var(--bad);border:1px solid rgba(179,38,30,.4)}
.btn[disabled]{opacity:.45;cursor:default}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#cdbf9c;border-radius:20px;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--or)}
.sw input:checked+i::after{inset-inline-start:23px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;margin-bottom:4px;color:rgba(61,63,32,.8)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:#fff;border:1px solid rgba(61,63,32,.25);border-radius:10px;padding:9px 12px;direction:ltr;text-align:start}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;background:#fff;font-size:14px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.im{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.im .pv{aspect-ratio:1;border-radius:8px;background:#ecd9b3 center/cover no-repeat}
.im .pv.c{background-size:contain}
.im .ops{display:flex;gap:4px;justify-content:space-between}
.im .ops button{flex:1;background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:2px 0;font-size:14px}
.im label.ck{display:flex;gap:6px;align-items:center;font-size:12px}
.addimg{aspect-ratio:1;border:2px dashed rgba(61,63,32,.3);border-radius:12px;background:none;cursor:pointer;display:grid;place-items:center;color:rgba(61,63,32,.75);font-size:14px;text-align:center;padding:6px}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--green);color:var(--cream);z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none}
.bar.on{display:block}
.bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0}
.bar .btn{background:var(--cream);color:var(--green)}
.toast{position:fixed;inset-inline:16px;bottom:84px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:520px;margin-inline:auto}
.toast.err{border-color:var(--bad);color:var(--bad)}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 20px));max-height:calc(100vh - 24px);background:var(--cream);color:var(--ink)}
dialog::backdrop{background:rgba(30,30,10,.5)}
dialog form{padding:16px}
dialog .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
dialog .hd h1{margin:0}
dialog .ft{display:flex;gap:10px;justify-content:flex-start;margin-top:8px}
.login{max-width:480px;margin:40px auto}
.steps{padding-inline-start:20px;margin:6px 0 16px;font-size:14px}
.steps li{margin-bottom:4px}
.empty{padding:26px;text-align:center;color:rgba(61,63,32,.65)}
.hide{display:none!important}
.badge{display:inline-block;font-size:12px;border-radius:10px;padding:0 8px;background:rgba(61,63,32,.12);margin-inline-start:6px}
.lgsw{position:fixed;left:12px;bottom:88px;z-index:60;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
html[dir=ltr] body{text-align:left}
.prow .pact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.prow .pact .btn{flex:1 1 0;min-width:96px;text-align:center}
.prow.off .row{opacity:.55}
.btn.ghost.on{background:var(--or);color:#fff;border-color:var(--or)}
.badge.soon{background:rgba(237,113,46,.18);color:#b3470f}
.nb{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--or);color:#fff;font:700 11px system-ui;text-align:center;margin-inline-start:6px;padding:0 5px;font-style:normal}
.ord.new{border-color:var(--or);box-shadow:0 0 0 2px rgba(237,113,46,.18)}
.ord .oh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ord .oi{margin:0 0 8px;padding-inline-start:18px}
.ord .oc{font-size:14px;margin-bottom:12px;padding:10px 12px;background:rgba(61,63,32,.05);border-radius:10px}
.ord .oc pre{margin:8px 0;font:inherit;white-space:pre-wrap}
.osteps{display:flex;flex-direction:column;gap:10px}
.ost{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.4)}
.ost.ok{border-color:#4f9a45;background:rgba(79,154,69,.1)}
.ost .od{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(61,63,32,.3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.ost.ok .od{background:#4f9a45;border-color:#4f9a45}
.ost .ob{flex:1;min-width:0}
.ost .oa{font-size:12px;color:rgba(61,63,32,.65);margin-inline:8px}
.ost .btn{margin-top:8px}
.ost .rst{color:var(--or);font-size:20px;letter-spacing:2px}
.ost .rtx{margin:4px 0}
.ost .tl{font-weight:700;margin-inline:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CFG={repo:"kylixe-de/kylixe",branch:"main"};
var SHAPES={wave:"موجة",tower:"برج",round:"مدوّرة",hour:"ساعة رملية",pinch:"مضغوطة",cup:"كأس",dish:"طبق",pot:"أصيص",candle:"شمعدان"};
var COLS={cream:"كريمي",terracotta:"تيراكوتا",sand:"رملي",brown:"بني",sage:"أخضر فاتح",orange:"برتقالي"};
var POS={left:"اليسار",center:"الوسط",right:"اليمين"};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var S={token:"",repo:CFG.repo,branch:CFG.branch,site:null,cats:null,prods:null,sha:{},orig:{},pend:{},tab:"prods"};
try{var sv=JSON.parse(localStorage.getItem("kylixe-admin")||"{}");S.token=sv.token||"";S.repo=sv.repo||S.repo;S.branch=sv.branch||S.branch;S.orepo=sv.orepo||""}catch(e){}
S.orepo=S.orepo||"kylixe-de/kylixe-orders";

/* ---------- GitHub API ---------- */
function api(path,opt){opt=opt||{};return fetch("https://api.github.com/repos/"+S.repo+"/contents/"+path+(opt.method?"":"?ref="+encodeURIComponent(S.branch)),{method:opt.method||"GET",headers:{Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.message||("HTTP "+r.status));e.status=r.status;throw e}return j})})}
function dec(b64){var bin=atob(b64.replace(/\s/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function enc(str){var u=new TextEncoder().encode(str),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function blob64(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(String(f.result).split(",")[1])};f.onerror=rej;f.readAsDataURL(b)})}
function loadAll(){
 return Promise.all([["site","data/site.json"],["cats","data/categories.json"],["prods","data/products.json"]].map(function(x){return api(x[1]).then(function(j){S[x[0]]=JSON.parse(dec(j.content));S.sha[x[0]]=j.sha;S.orig[x[0]]=JSON.stringify(S[x[0]])})}))
}

/* ---------- helpers ---------- */
function slug(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function dirtyKeys(){return["site","cats","prods"].filter(function(k){return JSON.stringify(S[k])!==S.orig[k]})}
function imgUrl(p){if(!p)return"";return S.pend[p]?S.pend[p].url:"../"+String(p).replace(/^\.?\/+/,"")}
function toast(m,err){var t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},err?7000:3500)}
function field(label,html){return '<label class="f"><span>'+label+'</span>'+html+'</label>'}
function inp(path,v,type){return '<input type="'+(type||"text")+'" data-b="'+path+'" value="'+esc(v)+'"'+(type==="number"?' step="any"':'')+'>'}
function txt(path,v){return '<textarea data-b="'+path+'">'+esc(v)+'</textarea>'}
function sel(path,v,opts,blank){return '<select data-b="'+path+'">'+(blank?'<option value="">'+blank+'</option>':'')+Object.keys(opts).map(function(k){return '<option value="'+esc(k)+'"'+(k===v?' selected':'')+'>'+esc(opts[k])+' ('+esc(k)+')</option>'}).join("")+'</select>'}
function sw(path,v){return '<span class="sw"><input type="checkbox" data-b="'+path+'"'+(v?' checked':'')+'><i></i></span>'}
function getp(o,p){return p.split(".").reduce(function(a,k){return a==null?a:a[k]},o)}
function setp(o,p,v){var ks=p.split("."),l=ks.pop(),t=ks.reduce(function(a,k){if(a[k]==null)a[k]={};return a[k]},o);t[l]=v}

/* ---------- image processing ---------- */
function prepImage(file){
 return createImageBitmap(file).then(function(bmp){
  var m=Math.max(bmp.width,bmp.height),ext=(file.type.split("/")[1]||"jpg").replace("jpeg","jpg");
  if(!/^(webp|jpg|png)$/.test(ext))ext="jpg";
  if(file.size<1800000&&m<=2600)return{blob:file,ext:ext};
  var k=Math.min(1,2400/m),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(function(b){if(b&&b.type==="image/webp")res({blob:b,ext:"webp"});else c.toBlob(function(b2){res({blob:b2,ext:ext==="png"?"png":"jpg"})},ext==="png"?"image/png":"image/jpeg",.92)},"image/webp",.92)});
 });
}
function pickImage(folder,base,cb){
 var i=document.createElement("input");i.type="file";i.accept="image/*";
 i.onchange=function(){var f=i.files[0];if(!f)return;prepImage(f).then(function(r){var p="images/"+folder+"/"+(slug(base)||"photo")+"-"+Date.now().toString(36)+"."+r.ext;S.pend[p]={blob:r.blob,url:URL.createObjectURL(r.blob)};cb(p)}).catch(function(){toast("ما قدرت أقرأ هالصورة. جرّب صورة JPG أو PNG أو WebP.",1)})};
 i.click();
}

/* ---------- rendering ---------- */
var TABS=[["prods","المنتجات"],["cats","الفئات"],["hero","صور الصفحة الأولى"],["texts","النصوص والعرض"],["contact","التواصل والشحن"],["imp","Impressum"]];
function render(){
 var app=$("#app");
 if(!S.site){app.innerHTML=loginHTML();return}
 app.innerHTML='<header class="top"><div class="wrap"><b>KYLIXE</b><span><button data-act="reload">تحديث</button> <button data-act="logout">خروج</button></span></div></header><div class="wrap"><nav class="tabs" role="tablist">'+TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</nav><div id="pane"></div></div><div class="bar" id="bar"><div class="wrap"><span id="bmsg"></span><button class="btn" data-act="save">حفظ ونشر</button></div></div>';
 pane();bar();
}
function bar(){var n=dirtyKeys().length,b=$("#bar");if(!b)return;b.classList.toggle("on",n>0||Object.keys(S.pend).length>0&&n>0);$("#bmsg").textContent=n?"في تغييرات غير محفوظة":""}
function loginHTML(){
 return '<div class="wrap login"><h1>لوحة تحكم Kylixe</h1><p class="sub">أدخل مفتاح GitHub مرة وحدة، وبيتحفظ على هاد الجهاز فقط.</p><div class="card"><ol class="steps"><li>افتح github.com وسجّل دخولك، ثم Settings ← Developer settings ← Personal access tokens ← <b>Fine-grained tokens</b> ← Generate new token.</li><li>Repository access: اختر Only select repositories ثم <b>kylixe</b> فقط.</li><li>Permissions ← Repository permissions ← <b>Contents: Read and write</b>.</li><li>انسخ المفتاح والصقه هون.</li></ol>'
 +field("المفتاح (Token)",'<input type="password" id="tk" autocomplete="off" value="'+esc(S.token)+'">')
 +field("المستودع (Repository)",'<input type="text" id="rp" value="'+esc(S.repo)+'">')+field("مستودع الطلبات (خاص / Private)",'<input type="text" id="orp" value="'+esc(S.orepo)+'">')
 +'<p id="lerr" class="meta" style="color:var(--bad)"></p><button class="btn" data-act="login">دخول</button></div></div>';
}
function pane(){
 var p=$("#pane"),f={prods:paneProds,cats:paneCats,hero:paneHero,texts:paneTexts,contact:paneContact,imp:paneImp}[S.tab];p.innerHTML=f();
}
function catName(id){var c=(S.cats||[]).filter(function(x){return slug(x.id)===slug(id)})[0];return c?(c.name_de||c.name_en||c.id):id}
function paneProds(){
 var h='<h1>المنتجات</h1><p class="sub">اضغط على منتج لتعديله. تحت كل منتج أزرار: إخفاء، Coming soon، حذف.</p><p><button class="btn" data-act="newprod">+ منتج جديد</button></p>';
 if(!S.prods.length)h+='<div class="card empty">ما في منتجات بعد.</div>';
 S.prods.forEach(function(p,i){var im=(p.images||[])[0],off=p.active===false,cs=!!p.coming_soon;h+='<div class="card prow'+(off?' off':'')+'" data-i="'+i+'"><div class="row"><span class="thumb'+(im&&im.cutout?' c':'')+'" style="'+(im?'background-image:url(\''+esc(imgUrl(im.src))+'\')':'')+'"></span><div class="grow" data-act="editprod" data-i="'+i+'" style="cursor:pointer"><div class="title">'+esc(p.name_de||p.name_en||"(بدون اسم)")+(off?'<span class="badge">مخفي</span>':'')+(cs?'<span class="badge soon">قريباً</span>':'')+'</div><div class="meta">'+'<bdi>'+esc(catName(p.category))+'</bdi> · <bdi>'+esc(p.price)+' €</bdi></div></div></div><div class="pact"><button type="button" class="btn sm ghost" data-act="phide" data-i="'+i+'">'+(off?'إظهار':'إخفاء')+'</button><button type="button" class="btn sm ghost'+(cs?' on':'')+'" data-act="psoon" data-i="'+i+'" aria-pressed="'+cs+'">Coming soon</button><button type="button" class="btn sm bad" data-act="pdel" data-i="'+i+'">حذف</button></div></div>'});
 return h;
}
function paneCats(){
 var h='<h1>الفئات</h1><p class="sub">إخفاء فئة بيخفي كل منتجاتها.</p><p><button class="btn" data-act="newcat">+ فئة جديدة</button></p>';
 S.cats.forEach(function(c,i){var n=S.prods.filter(function(p){return slug(p.category)===slug(c.id)}).length;h+='<div class="card row"><span class="thumb'+(c.image&&c.image_cutout!==false?' c':'')+'" style="'+(c.image?'background-image:url(\''+esc(imgUrl(c.image))+'\')':'')+'"></span><div class="grow" data-act="editcat" data-i="'+i+'" style="cursor:pointer"><div class="title">'+esc(c.name_de||c.name_en||c.id)+(c.active===false?'<span class="badge">مخفية</span>':'')+'</div><div class="meta">'+esc(c.id)+' · '+n+' منتج</div></div><span class="sw"><input type="checkbox" data-tog="cats" data-i="'+i+'"'+(c.active!==false?' checked':'')+'><i></i></span></div>'});
 return h;
}
function paneHero(){
 var s=S.site;s.hero_images=s.hero_images||[];
 var h='<h1>صور الصفحة الأولى</h1><p class="sub">حتى 3 صور بتتبدّل لحالها. إذا حطيت أقل من 3، بيظهر رسم مكان الناقصة.</p>';
 for(var i=0;i<3;i++){var x=s.hero_images[i]||{};h+='<div class="card"><b>الصورة '+(i+1)+'</b><div class="row" style="margin-top:10px;align-items:flex-start"><span class="thumb" style="width:120px;height:80px;'+(x.image?'background-image:url(\''+esc(imgUrl(x.image))+'\')':'')+'"></span><div class="grow"><p style="margin:0 0 8px"><button class="btn sm" data-act="heropick" data-i="'+i+'">'+(x.image?"تبديل الصورة":"رفع صورة")+'</button> '+(x.image?'<button class="btn sm bad" data-act="herodel" data-i="'+i+'">حذف</button>':'')+'</p>'+(x.image?field("الجزء الظاهر من الصورة",sel("site.hero_images."+i+".position",x.position||"center",POS)):'')+'</div></div></div>'}
 h+=field("عدد الثواني بين الصور",inp("site.hero_seconds",s.hero_seconds,"number"));
 return h;
}
function pair(label,path,area){var v=getp(S.site,path)||{};return '<div class="card"><b>'+label+'</b><div class="two" style="margin-top:8px">'+field("English",(area?txt:inp)(("site."+path+".en"),v.en))+field("Deutsch",(area?txt:inp)(("site."+path+".de"),v.de))+'</div></div>'}
function paneTexts(){
 var s=S.site,h='<h1>النصوص والعرض</h1><p class="sub">النصوص بالإنجليزي والألماني. التعديل بيظهر بعد الحفظ.</p>';
 h+=pair("الصفحة الأولى: الجملة تحت اللوغو","hero_subtitle")+pair("عنوان قسم الفئات","categories_title");
 h+='<div class="card"><div class="row"><b class="grow">إخفاء كل المنتجات وإظهار "Coming soon" داخل كل فئة</b>'+sw("site.products_hidden",!!s.products_hidden)+'</div><p class="hint">المنتجات ما بتنحذف، بس بتختفي من الموقع لحد ما تطفي هالمفتاح.</p></div>';
 h+='<div class="card"><div class="row"><b class="grow">قسم العرض</b>'+sw("site.offer_enabled",s.offer_enabled!==false)+'</div><div style="margin-top:10px" class="two">'+field("النسبة %",inp("site.offer_percent",s.offer_percent,"number"))+'</div></div>';
 h+=pair("كلمة العرض (مثل Rabatt)","offer_label");

var O={list:[],loaded:false,loading:false,err:"",count:-1,unseen:0};
var CARR={DHL:"https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode=",DPD:"https://tracking.dpd.de/status/de_DE/parcel/",GLS:"https://gls-group.com/DE/de/paketverfolgung?match=",Hermes:"https://www.myhermes.de/empfangen/sendungsverfolgung/sendungsinformation/#",UPS:"https://www.ups.com/track?tracknum=","Deutsche Post":"https://www.deutschepost.de/sendung/simpleQuery.html?form.sendungsnummer=","أخرى":""};
function oapi(path,opt){opt=opt||{};return fetch("https://api.github.com/repos/"+S.orepo+"/contents/"+path,{method:opt.method||"GET",headers:{Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){if(r.ok)return r.json();var e=new Error("HTTP "+r.status);e.status=r.status;throw e})}
function oList(){return oapi("orders").then(function(a){return a.filter(function(f){return /\.json$/.test(f.name)&&f.name.indexOf("_s_")!==0})}).catch(function(e){if(e.status===404)return[];throw e})}
function loadOrders(quiet){
 if(O.loading)return Promise.resolve();O.loading=true;if(!quiet){O.err="";if(S.tab==="orders")pane()}
 return oList().then(function(files){
  return Promise.all(files.slice(0,150).map(function(f){return oapi(f.path).then(function(j){try{return{path:f.path,sha:j.sha,data:JSON.parse(dec(j.content))}}catch(x){return null}}).catch(function(){return null})}))
 }).then(function(arr){
  var old={};O.list.forEach(function(o){old[o.path]=o});
  O.list=arr.filter(Boolean).sort(function(a,b){return String(b.data.created).localeCompare(String(a.data.created))});
  O.list.forEach(function(o){o.isNew=old[o.path]?old[o.path].isNew:!o.data.seen});
  O.count=O.list.length;O.unseen=O.list.filter(function(o){return o.isNew}).length;O.loaded=true;O.err=""
 }).catch(function(e){O.err=e.status===404?"ما لقيت مستودع الطلبات. تأكد من اسمه ومن صلاحيات المفتاح.":e.status===401?"المفتاح غير صحيح أو منتهي.":"صار خطأ: "+e.message;O.loaded=true}).then(function(){O.loading=false;badge();if(S.tab==="orders"){pane();markSeen()}})
}
function oSave(o){
 return oapi(o.path,{method:"PUT",body:{message:"update "+o.path,sha:o.sha,content:enc(JSON.stringify(o.data,null,1))}}).then(function(j){o.sha=j.content.sha;return true}).catch(function(e){toast(e.status===409?"الطلب تغيّر من مكان تاني. اضغط تحديث.":"ما انحفظ:"+" "+e.message,1);return false})
}
function badge(){
 var b=document.querySelector('[data-tab="orders"]');if(b){var s=b.querySelector(".nb");if(O.unseen>0){if(!s){s=document.createElement("i");s.className="nb";b.appendChild(s)}s.textContent=O.unseen}else if(s)s.remove()}
 var t=document.title.replace(/^\(\d+\)\s*/,"");document.title=(O.unseen>0?"("+O.unseen+") ":"")+t
}
function fmtD(s){if(!s)return"";var d=new Date(s);return isNaN(d)?"":d.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}
function addrText(o){var d=o.data,s=d.shipping||{},c=d.customer||{};return[s.name,s.line1,s.line2,(s.postal_code+" "+s.city).trim(),s.country].filter(Boolean).join("\n")}

 var h='<div class="card ord'+(o.isNew?' new':'')+'" data-oi="'+i+'"><div class="oh"><b><bdi>'+esc(fmtD(d.created))+'</bdi></b>'+(o.isNew?'<span class="badge soon">جديد</span>':'')+'<span class="grow"></span><b><bdi>'+esc(d.amount_total)+' '+esc(d.currency||"EUR")+'</bdi></b></div>'
 +'<ul class="oi">'+items+'</ul>'

 +stepRow(!!d.paid,"استلام الطلبية","",d.paid?"تلقائي":"")
 +stepRow(!!pr.done,"تحضير الطلبية",'<span class="oa">'+esc(fmtD(pr.at))+'</span><button type="button" class="btn sm ghost'+(pr.done?' on':'')+'" data-oact="prep" data-oi="'+i+'">'+(pr.done?"تم التحضير":"تحديد كمحضّرة")+'</button>')

 +stepRow(!!rv.rating,"رأي العميل",rv.rating?'<div class="rst"><bdi>'+'★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating)+'</bdi></div>'+(rv.text?'<p class="rtx"><bdi>'+esc(rv.text)+'</bdi></p>':'')+'<span class="oa">'+esc(fmtD(rv.at))+'</span>':'<button type="button" class="btn sm ghost" data-oact="qr" data-oi="'+i+'">QR Code</button>',rv.rating?"تلقائي":"")
 +'</div></div>';
 return h
