<script>

var SHAPES={wave:"Welle",tower:"Turm",round:"Rund",hour:"Sanduhr",pinch:"Gedrückt",cup:"Becher",dish:"Teller",pot:"Pflanztopf",candle:"Kerzenhalter"};
var COLS={cream:"Creme",terracotta:"Terrakotta",sand:"Sand",brown:"Braun",sage:"Hellgrün",orange:"Orange"};
var POS={left:"Links",center:"Mitte",right:"Rechts"};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var S={token:"",repo:CFG.repo,branch:CFG.branch,site:null,cats:null,prods:null,sha:{},orig:{},pend:{},tab:"cats"};
try{var sv=JSON.parse(localStorage.getItem("kylixe-admin")||"{}");S.token=sv.token||"";S.repo=sv.repo||S.repo;S.branch=sv.branch||S.branch;S.orepo=sv.orepo||""}catch(e){}
S.orepo=S.orepo||"kylixe-de/kylixe-orders";

/* ---------- GitHub API ---------- */
function api(path,opt){opt=opt||{};return fetch("https://api.github.com/repos/"+S.repo+"/contents/"+path+(opt.method?"":"?ref="+encodeURIComponent(S.branch)),{method:opt.method||"GET",headers:{Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.message||("HTTP "+r.status));e.status=r.status;throw e}return j})})}
function dec(b64){var bin=atob(b64.replace(/\s/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function enc(str){var u=new TextEncoder().encode(str),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function blob64(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(String(f.result).split(",")[1])};f.onerror=rej;f.readAsDataURL(b)})}
function loadAll(){
 return Promise.all([["site","data/site.json"],["cats","data/categories.json"],["prods","data/products.json"]].map(function(x){return api(x[1]).then(function(j){S[x[0]]=JSON.parse(dec(j.content));S.sha[x[0]]=j.sha;S.orig[x[0]]=JSON.stringify(S[x[0]])})}))
}

/* ---------- helpers ---------- */
function slug(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function cnz(v){if(Array.isArray(v)){var a=v.map(cnz);while(a.length&&a[a.length-1]===undefined)a.pop();return a.length?a:undefined}if(v&&typeof v==="object"){var o={},n=0;Object.keys(v).sort().forEach(function(k){var x=cnz(v[k]);if(x!==undefined){o[k]=x;n++}});return n?o:undefined}return v===""||v==null?undefined:v}
function cj(v){return JSON.stringify(cnz(v))}
function dirtyKeys(){return["site","cats","prods"].filter(function(k){return cj(S[k])!==cj(JSON.parse(S.orig[k]||"null"))})}
function imgUrl(p){if(!p)return"";return S.pend[p]?S.pend[p].url:"../"+String(p).replace(/^\.?\/+/,"")}
function toast(m,err){var t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},err?7000:3500)}

/* ---------- Orders (private repo) ---------- */
var O={list:[],loaded:false,loading:false,err:"",count:-1,unseen:0};
var CARR={DHL:"https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode=",DPD:"https://tracking.dpd.de/status/de_DE/parcel/",GLS:"https://gls-group.com/DE/de/paketverfolgung?match=",Hermes:"https://www.myhermes.de/empfangen/sendungsverfolgung/sendungsinformation/#",UPS:"https://www.ups.com/track?tracknum=","Deutsche Post":"https://www.deutschepost.de/sendung/simpleQuery.html?form.sendungsnummer=","Other":""};
function oapi(path,opt){opt=opt||{};return fetch("https://api.github.com/repos/"+S.orepo+"/contents/"+path,{method:opt.method||"GET",headers:{Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){if(r.ok)return r.json();var e=new Error("HTTP "+r.status);e.status=r.status;throw e})}
function oList(){return oapi("orders").then(function(a){return a.filter(function(f){return /\.json$/.test(f.name)&&f.name.charAt(0)!=="_"})}).catch(function(e){if(e.status===404)return[];throw e})}
function loadOrders(quiet){
 if(O.loading)return Promise.resolve();O.loading=true;if(!quiet){O.err="";if(S.tab==="orders")pane()}
 return oList().then(function(files){
  return Promise.all(files.slice(0,150).map(function(f){return oapi(f.path).then(function(j){try{return{path:f.path,sha:j.sha,data:JSON.parse(dec(j.content))}}catch(x){return null}}).catch(function(){return null})}))
 }).then(function(arr){
  var old={};O.list.forEach(function(o){old[o.path]=o});
  O.list=arr.filter(Boolean).sort(function(a,b){return String(b.data.created).localeCompare(String(a.data.created))});
  O.list.forEach(function(o){o.isNew=old[o.path]?old[o.path].isNew:!o.data.seen});
  O.count=O.list.length;O.unseen=O.list.filter(function(o){return o.isNew}).length;O.loaded=true;O.err=""
 }).catch(function(e){O.err=e.status===404?"Bestellungs-Repository nicht gefunden. Name und Schlüsselrechte prüfen.":e.status===401?"Der Schlüssel ist ungültig oder abgelaufen.":"Fehler: "+e.message;O.loaded=true}).then(function(){O.loading=false;badge();if(S.tab==="orders"){pane();markSeen()}})
}
function oSave(o){
 return oapi(o.path,{method:"PUT",body:{message:"update "+o.path,sha:o.sha,content:enc(JSON.stringify(o.data,null,1))}}).then(function(j){o.sha=j.content.sha;return true}).catch(function(e){toast(e.status===409?"Die Bestellung wurde anderswo geändert. Auf „Aktualisieren“ klicken.":"Nicht gespeichert:"+" "+e.message,1);return false})
}
function badge(){
 var b=document.querySelector('[data-tab="orders"]');if(b){var s=b.querySelector(".nb");if(O.unseen>0){if(!s){s=document.createElement("i");s.className="nb";b.appendChild(s)}s.textContent=O.unseen}else if(s)s.remove()}
 var t=document.title.replace(/^\(\d+\)\s*/,"");document.title=(O.unseen>0?"("+O.unseen+") ":"")+t
}
function fmtD(s){if(!s)return"";var d=new Date(s);return isNaN(d)?"":d.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}
function addrText(o){var d=o.data,s=d.shipping||{},c=d.customer||{};return[s.name,s.line1,s.line2,(s.postal_code+" "+s.city).trim(),s.country].filter(Boolean).join("\n")}
function stepRow(done,label,body,auto){return '<div class="ost'+(done?' ok':'')+'"><span class="od" aria-hidden="true">'+(done?'✓':'')+'</span><div class="ob"><b>'+label+'</b>'+(auto?'<span class="oa">'+auto+'</span>':'')+(body||'')+'</div></div>'}
function orderCard(o,i){
 var d=o.data,st=d.steps||{},pr=st.prep||{},sh=st.shipped||{},dl=st.delivered||{},rv=d.review||{},c=d.customer||{};

 var carr='<select data-ocar="'+i+'"><option value="">—</option>'+Object.keys(CARR).map(function(k){return '<option value="'+esc(k)+'"'+(k===sh.carrier?' selected':'')+'>'+esc(k)+'</option>'}).join("")+'</select>';
 var link=sh.tracking&&CARR[sh.carrier]?' <a class="tl" target="_blank" rel="noopener" href="'+esc(CARR[sh.carrier]+encodeURIComponent(sh.tracking))+'">↗</a>':"";
 var h='<div class="card ord'+(o.isNew?' new':'')+'" data-oi="'+i+'"><div class="oh"><b><bdi>'+esc(fmtD(d.created))+'</bdi></b>'+(o.isNew?'<span class="badge soon">Neu</span>':'')+'<span class="grow"></span><b><bdi>'+esc(d.amount_total)+' '+esc(d.currency||"EUR")+'</bdi></b></div>'
 +'<ul class="oi">'+items+'</ul>'
 +'<div class="oc"><bdi>'+esc(c.name||"")+'</bdi><br><bdi>'+esc(c.email||"")+'</bdi>'+(c.phone?'<br><bdi>'+esc(c.phone)+'</bdi>':'')+'<pre>'+esc(addrText(o))+'</pre><button type="button" class="btn sm ghost" data-oact="copy" data-oi="'+i+'">Adresse kopieren</button></div>'
 +'<div class="osteps">'
 +stepRow(!!d.paid,"Bestellung eingegangen","",d.paid?"automatisch":"")
 +stepRow(!!pr.done,"Bestellung vorbereiten",'<span class="oa">'+esc(fmtD(pr.at))+'</span><button type="button" class="btn sm ghost'+(pr.done?' on':'')+'" data-oact="prep" data-oi="'+i+'">'+(pr.done?"Vorbereitet":"Als vorbereitet markieren")+'</button>')
 +stepRow(!!sh.done,"Bestellung versenden",'<span class="oa">'+esc(fmtD(sh.at))+'</span><div class="two">'+field("Versanddienstleister",carr)+field("Sendungsnummer",'<input type="text" data-otr="'+i+'" value="'+esc(sh.tracking||"")+'">')+'</div>'+link+'<button type="button" class="btn sm ghost'+(sh.done?' on':'')+'" data-oact="ship" data-oi="'+i+'">'+(sh.done?"Versendet":"Als versendet markieren")+'</button>')
 +stepRow(!!dl.done,"Zustellung an den Kunden",'<span class="oa">'+esc(fmtD(dl.at))+'</span><button type="button" class="btn sm ghost'+(dl.done?' on':'')+'" data-oact="deliv" data-oi="'+i+'">'+(dl.done?"Zugestellt":"Als zugestellt markieren")+'</button>')
 +stepRow(!!rv.rating,"Kundenbewertung",rv.rating?'<div class="rst"><bdi>'+'★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating)+'</bdi></div>'+(rv.text?'<p class="rtx"><bdi>'+esc(rv.text)+'</bdi></p>':'')+'<span class="oa">'+esc(fmtD(rv.at))+'</span>':'<button type="button" class="btn sm ghost" data-oact="qr" data-oi="'+i+'">QR Code</button>',rv.rating?"automatisch":"")
 +'</div></div>';
 return h
